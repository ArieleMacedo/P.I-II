<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini-Prontuário</title>

  <!-- Bootstrap 5.3 via CDN: grid, utilitários e componentes base -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous" />

  <!-- Nossa camada: a ordem importa. Tokens -> base -> componentes -->
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>

<body>
  <header class="app-header">
    <div class="container">
      <p class="app-header__eyebrow">IFPI · Programação para Internet II</p>
      <h1 class="app-header__title">Mini-Prontuário</h1>
    </div>
  </header>

  <main class="container app-main">

    <!-- ------------------------------------------------------
         Barra de filtros.
         Nenhum evento é registrado aqui: isso é papel do app.js.
         O HTML descreve a ESTRUTURA, não o comportamento.
    ------------------------------------------------------- -->
    <section class="toolbar" aria-label="Filtros da lista de pacientes">
      <div class="toolbar__search">
        <label class="form-label" for="search-input">Buscar paciente</label>
        <input
          id="search-input"
          class="form-control form-control-lg"
          type="search"
          placeholder="Digite parte do nome…"
          autocomplete="off" />
      </div>

      <div class="toolbar__filter form-check form-switch">
        <input class="form-check-input" type="checkbox" id="only-active-input" />
        <label class="form-check-label" for="only-active-input">
          Mostrar apenas pacientes ativos
        </label>
      </div>
    </section>

    <!-- ------------------------------------------------------
         Cadastro de paciente.
         Note que NÃO usamos <form>: assim o navegador não tenta
         recarregar a página. O envio é 100% nosso, via fetch.
    ------------------------------------------------------- -->
    <section class="patient-form" aria-label="Cadastrar novo paciente">
      <h2 class="patient-form__title">Novo paciente</h2>

      <div class="patient-form__grid">
        <div>
          <label class="form-label" for="name-input">Nome completo</label>
          <input id="name-input" class="form-control" type="text" autocomplete="off" />
        </div>
        <div>
          <label class="form-label" for="birth-date-input">Data de nascimento</label>
          <input id="birth-date-input" class="form-control" type="date" />
        </div>
        <div>
          <label class="form-label" for="national-id-input">CNS</label>
          <input id="national-id-input" class="form-control" type="text" autocomplete="off" />
        </div>
      </div>

      <button id="save-button" class="btn btn-success mt-3" type="button">
        Cadastrar paciente
      </button>

      <p id="form-feedback" class="patient-form__feedback" role="alert"></p>
    </section>

    <section id="detail-panel" class="detail-panel" hidden></section>

    <p id="result-counter" class="result-counter" aria-live="polite"></p>

    <!-- A lista é desenhada por render.js. Ela nasce vazia de propósito. -->
    <ul id="patient-list" class="patient-list"></ul>

  </main>

  <!-- type="module" habilita import/export no navegador -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
