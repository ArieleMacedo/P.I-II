<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel de Medicação</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <p class="app-header__eyebrow">IFPI · Programação para Internet II · Atividade de Laboratório</p>
      <h1 class="app-header__title">Painel de Medicação</h1>
    </div>
  </header>

  <main class="container app-main">

    <section class="med-form" aria-label="Nova prescrição">
      <h2 class="med-form__title">Nova prescrição</h2>
      <div class="med-form__grid">
        <div>
          <label class="form-label" for="patient-name-input">Paciente</label>
          <input id="patient-name-input" class="form-control" type="text" autocomplete="off" />
        </div>
        <div>
          <label class="form-label" for="medication-name-input">Medicamento</label>
          <input id="medication-name-input" class="form-control" type="text" autocomplete="off" />
        </div>
        <div>
          <label class="form-label" for="dosage-input">Dosagem</label>
          <input id="dosage-input" class="form-control" type="text" placeholder="ex: 500mg" autocomplete="off" />
        </div>
        <div>
          <label class="form-label" for="route-input">Via</label>
          <select id="route-input" class="form-select">
            <option value="Oral">Oral</option>
            <option value="Intravenosa">Intravenosa</option>
            <option value="Intramuscular">Intramuscular</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="scheduled-at-input">Horário previsto</label>
          <input id="scheduled-at-input" class="form-control" type="datetime-local" />
        </div>
        <div>
          <label class="form-label" for="notes-input">Observações (opcional)</label>
          <input id="notes-input" class="form-control" type="text" autocomplete="off" />
        </div>
      </div>
      <button id="save-button" class="btn btn-success mt-3" type="button">Cadastrar prescrição</button>
      <p id="form-feedback" class="med-form__feedback" role="alert"></p>
    </section>

    <section id="detail-panel" class="detail-panel" hidden></section>

    <p id="result-counter" class="result-counter" aria-live="polite"></p>
    <ul id="medication-list" class="medication-list"></ul>

  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
